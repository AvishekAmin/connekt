name: Connekt CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Backend Verification Job
  backend-ci:
    name: Backend Lint, Syntax & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 8080
      MONGO_URI: mongodb://127.0.0.1:27017/connekt_ci_test?directConnection=true
      JWT_ACCESS_SECRET: connekt_ci_test_access_secret_min_32_chars_long
      JWT_REFRESH_SECRET: connekt_ci_test_refresh_secret_min_32_chars_long
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Verify Backend Syntax
        working-directory: backend
        run: |
          node --check src/app.js
          node --check src/config/env.js
          node --check src/config/database.js
          node --check src/sockets/socketManager.js

      - name: Run Backend Automated Test Suite
        working-directory: backend
        run: npm test

  # 2. Frontend Verification Job
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Verify Production Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:8080

  # 3. Docker Container Build Verification Job
  docker-validation:
    name: Dockerfile Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: connekt-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_BACKEND_URL=http://localhost:8080
          tags: connekt-frontend:ci

  # 4. Docker Compose Orchestration Validation Job
  compose-validation:
    name: Docker Compose Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.docker.example .env
          docker compose config
